<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RentEase - Properties</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <header class="navbar">
    <div class="nav-container">
      <a href="../index.html" class="brand">RentEase</a>
      <nav class="nav-links">
        <a href="../index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="properties.html">Properties</a>
        <a href="rent.html">Rent</a>
        <a href="maintenance.html">Maintenance</a>
        <a href="../index.html" class="btn btn-secondary">Logout</a>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <section class="section">
      <div class="section-header">
        <h2>Properties List</h2>
        <button class="btn btn-primary">+ New Property</button>
      </div>

      <table class="data-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Address</th>
            <th>Type</th>
            <th>Rent</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Apartment 4B</td>
            <td>123 Main St</td>
            <td>Residential</td>
            <td>$1,200</td>
            <td><span class="badge badge-success">Available</span></td>
            <td>
              <button class="btn btn-small">Edit</button>
              <button class="btn btn-small btn-danger">Delete</button>
            </td>
          </tr>
          <tr>
            <td>Unit 101</td>
            <td>456 Market St</td>
            <td>Commercial</td>
            <td>$2,500</td>
            <td><span class="badge badge-warning">Occupied</span></td>
            <td>
              <button class="btn btn-small">Edit</button>
              <button class="btn btn-small btn-danger">Delete</button>
            </td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
